<h2>Список товарів</h2>

<div *ngFor="let product of products" style="margin-bottom: 20px; padding: 15px; border: 1px solid #ccc; border-radius: 6px; max-width: 300px;">
  <h3 style="margin-top: 0;">{{ product.name }}</h3>
  <p>Ціна: {{ product.price }} грн</p>
  <a [routerLink]="['/product', product.id]" style="color: #007bff; text-decoration: none; font-weight: bold;">Переглянути товар</a>
</div>
